<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NewsPortal – Footer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════
   THEME VARIABLES
══════════════════════════════════ */
:root[data-theme="light"]{
  --bg:          #f2f0eb;
  --bg2:         #e8e5de;
  --surface:     #ffffff;
  --surface2:    #f7f5f0;
  --border:      #d4cfc4;
  --text:        #1a1714;
  --text2:       #4a4540;
  --text3:       #8a8278;
  --accent:      #c0392b;
  --accent2:     #e74c3c;
  --nav-bg:      #1a1714;
  --nav-text:    #f2f0eb;
}
:root[data-theme="dark"]{
  --bg:          #0f0e0d;
  --bg2:         #171614;
  --surface:     #1e1c1a;
  --surface2:    #252320;
  --border:      #2e2b28;
  --text:        #ede9e0;
  --text2:       #a09890;
  --text3:       #605850;
  --accent:      #e74c3c;
  --accent2:     #ff6b5b;
  --nav-bg:      #0a0908;
  --nav-text:    #ede9e0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Source Serif 4',serif;
  background:var(--bg);
  color:var(--text);
  transition:background .3s,color .3s;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  justify-content:flex-end;
}

/* ══════════════════════════════════
   BOTTOM USER BAR (Footer)
══════════════════════════════════ */
.userbar{
  background:var(--surface);
  border-top:2px solid var(--border);
  display:grid;grid-template-columns:1fr 2fr;
  transition:background .3s;
}
.userbar-left{
  padding:16px 24px;
  border-right:1px solid var(--border);
  display:flex;align-items:center;gap:14px;
}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#e67e22);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:18px;
  color:#fff;font-weight:700;flex-shrink:0;
}
.user-info .name{font-size:14px;font-weight:600;color:var(--text);}
.user-info .role{font-size:11.5px;color:var(--text3);}
.user-info .stats{
  display:flex;gap:12px;margin-top:4px;
  font-size:11px;color:var(--text3);
}
.user-info .stats span{display:flex;align-items:center;gap:3px;}

.userbar-right{
  padding:16px 24px;
  display:flex;flex-direction:column;gap:10px;
}
.post-row{
  display:flex;align-items:center;gap:14px;
}
.post-input{
  flex:1;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:24px;
  padding:10px 18px;
  font-family:'Source Serif 4',serif;
  font-size:13px;color:var(--text);
  outline:none;transition:border-color .2s,background .3s;
}
.post-input:focus{border-color:var(--accent);}
.post-input::placeholder{color:var(--text3);}

.attach-btn{
  background:var(--bg2);
  border:1px solid var(--border);
  color:var(--text2);
  border-radius:50%;
  width:40px;height:40px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;
  transition:background .2s,border-color .2s;
}
.attach-btn:hover{background:var(--surface2);border-color:var(--accent);}
.attach-btn.has-image{border-color:var(--accent);color:var(--accent);}

.post-btn{
  background:var(--accent);color:#fff;
  border:none;border-radius:24px;
  padding:10px 20px;font-size:13px;font-weight:700;
  cursor:pointer;white-space:nowrap;
  font-family:'Source Serif 4',serif;
  transition:background .2s,transform .15s;
}
.post-btn:hover{background:var(--accent2);transform:translateY(-1px);}
.post-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.image-preview-row{
  display:none;
  align-items:center;
  gap:10px;
  padding-left:2px;
}
.image-preview-row.show{display:flex;}
.image-preview-row img{
  width:52px;height:52px;object-fit:cover;
  border-radius:8px;border:1px solid var(--border);
}
.image-preview-row .fname{
  font-size:11.5px;color:var(--text3);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.remove-img-btn{
  background:none;border:none;color:var(--accent);
  cursor:pointer;font-size:12px;font-weight:700;
  font-family:'Source Serif 4',serif;
}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

/* toast */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
  background:var(--nav-bg);color:var(--nav-text);
  padding:12px 22px;border-radius:10px;
  font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  z-index:999;display:flex;align-items:center;gap:8px;max-width:320px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .check{
  color:#4a9d5f;font-size:16px;flex-shrink:0;
}

@media(max-width:600px){
  .userbar{grid-template-columns:1fr;}
  .userbar-left{border-right:none;border-bottom:1px solid var(--border);}
}
</style>
</head>
<body>

<!-- ══════════ BOTTOM USER BAR (FOOTER) ══════════ -->
<footer class="userbar">
  <div class="userbar-left">
    <div class="avatar">RK</div>
    <div class="user-info">
      <div class="name">Raj Kumar</div>
      <div class="role">Reader · Verified Member</div>
      <div class="stats">
        <span>📰 142 reads</span>
        <span>🔖 28 saved</span>
        <span>✍️ 5 posts</span>
      </div>
    </div>
  </div>
  <div class="userbar-right">
    <div class="post-row">
      <button class="attach-btn" id="attachBtn" type="button" title="Attach a photo">📷</button>
      <input type="file" id="imageInput" accept="image/*" style="display:none;"/>
      <input class="post-input" type="text" placeholder="Share a story or write your take…" id="postInput"/>
      <button class="post-btn" id="publishBtn" onclick="handlePost()">Publish ↗</button>
    </div>
    <div class="image-preview-row" id="imagePreviewRow">
      <img id="imagePreviewThumb" src="" alt="Selected image preview"/>
      <span class="fname" id="imageFileName"></span>
      <button class="remove-img-btn" id="removeImgBtn" type="button">Remove</button>
    </div>
  </div>
</footer>

<div class="toast" id="toast"><span class="check">✓</span><span id="toastMsg"></span></div>

<script>
const attachBtn      = document.getElementById('attachBtn');
const imageInput     = document.getElementById('imageInput');
const postInput      = document.getElementById('postInput');
const publishBtn     = document.getElementById('publishBtn');
const previewRow     = document.getElementById('imagePreviewRow');
const previewThumb   = document.getElementById('imagePreviewThumb');
const fileNameEl     = document.getElementById('imageFileName');
const removeImgBtn   = document.getElementById('removeImgBtn');
const toast          = document.getElementById('toast');
const toastMsg       = document.getElementById('toastMsg');

let selectedImageData = null; // base64 data URL
let selectedImageName = '';

// Storage key shared with admin.html (same browser / same origin).
// NOTE: this is a frontend-only mockup. In production this submission
// would POST to a backend API instead of writing to localStorage.
const POSTS_KEY = 'newsportal_user_posts';

attachBtn.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    selectedImageData = e.target.result;
    selectedImageName = file.name;
    previewThumb.src = selectedImageData;
    fileNameEl.textContent = file.name;
    previewRow.classList.add('show');
    attachBtn.classList.add('has-image');
  };
  reader.readAsDataURL(file);
});

removeImgBtn.addEventListener('click', () => {
  selectedImageData = null;
  selectedImageName = '';
  imageInput.value = '';
  previewRow.classList.remove('show');
  attachBtn.classList.remove('has-image');
});

function showToast(msg){
  toastMsg.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 3200);
}

function getPosts(){
  try{ return JSON.parse(localStorage.getItem(POSTS_KEY)) || []; }
  catch(e){ return []; }
}
function savePosts(posts){
  localStorage.setItem(POSTS_KEY, JSON.stringify(posts));
}

function handlePost(){
  const text = postInput.value.trim();

  if(!text && !selectedImageData){
    postInput.focus();
    showToast('Write something or attach a photo first.');
    return;
  }

  const post = {
    id: 'post_' + Date.now(),
    author: 'Raj Kumar',
    text: text,
    image: selectedImageData,
    imageName: selectedImageName,
    status: 'pending', // pending | approved | rejected
    createdAt: new Date().toISOString()
  };

  const posts = getPosts();
  posts.unshift(post);
  savePosts(posts);

  // reset form
  postInput.value = '';
  selectedImageData = null;
  selectedImageName = '';
  imageInput.value = '';
  previewRow.classList.remove('show');
  attachBtn.classList.remove('has-image');

  showToast('Your post has been submitted and is pending admin approval.');
}

postInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ handlePost(); }
});
</script>
</body>
</html>
